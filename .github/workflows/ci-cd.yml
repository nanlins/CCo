name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: cco

jobs:
  # ---------- CI: 测试 + 类型检查 + 构建（Linux / Windows 矩阵） ----------
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 干净安装（npm ci）
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 代码风格（ESLint）
        run: npm run lint

      - name: 格式检查（Prettier）
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 测试覆盖率
        run: node --import tsx --test --experimental-test-coverage tests/*.test.ts

      - name: 构建
        run: npm run build

  # ---------- 依赖审计（硬门禁；若上游出现无法立即修复的 high 漏洞，改为 advisory 并在 README 说明） ----------
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依赖审计
        run: npm audit --audit-level=high

  # ---------- 打包 smoke：真实 npm pack → tarball 断言 → 隔离安装 → CLI 版本/帮助真实执行 ----------
  pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm ci
      - name: 打包 smoke（npm pack + 产物断言 + 隔离安装 + CLI --version/--help）
        run: |
          set -euo pipefail
          npm pack --silent
          TGZ=$(ls nanlins-cco-*.tgz | head -1)
          echo "tarball: $TGZ"

          # 1) tarball 内容断言：发布包必须含编译产物/入口/许可证/清单
          tar -tzf "$TGZ" | grep -qx 'package/dist/main.js'
          tar -tzf "$TGZ" | grep -qx 'package/bin/anvil.js'
          tar -tzf "$TGZ" | grep -qx 'package/LICENSE'
          tar -tzf "$TGZ" | grep -qx 'package/package.json'
          # 源码/测试不得进入发布包
          if tar -tzf "$TGZ" | grep -q '^package/src/'; then echo "FAIL: src/ 不应进入发布包"; exit 1; fi
          if tar -tzf "$TGZ" | grep -q '^package/tests/'; then echo "FAIL: tests/ 不应进入发布包"; exit 1; fi

          # 2) 隔离安装
          mkdir -p /tmp/pack-smoke && cd /tmp/pack-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ" >/dev/null
          test -f node_modules/@nanlins/cco/dist/main.js
          node --check node_modules/@nanlins/cco/dist/main.js

          # 3) 真实执行 CLI 的版本/帮助命令（退出码 + 输出双断言）
          out_version=$(node node_modules/.bin/anvil --version)
          echo "version output: $out_version"
          echo "$out_version" | grep -Eq '^cco [0-9]+\.[0-9]+\.[0-9]+ \(anvil\)$'
          out_help=$(node node_modules/.bin/anvil --help)
          echo "$out_help" | grep -q 'anvil --version'

          # 4) 无 TTY + EOF：REPL 必须自行退出（0）；124 = 卡死未退出 → 失败
          set +e
          timeout 30 node node_modules/.bin/anvil < /dev/null > /tmp/anvil-eof.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "FAIL: anvil EOF 退出码 $code（期望 0，124=卡死）"
            cat /tmp/anvil-eof.log
            exit 1
          fi
          echo "pack smoke OK"

  # ---------- docker compose 配置校验（不依赖真实 .env；哨兵密码只用于解析） ----------
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          POSTGRES_PASSWORD=ci-placeholder docker compose config --quiet
          echo "docker compose config OK"

  # ---------- CD: 构建 Docker 镜像（PR 与 main 都构建；推送镜像需配置 secrets 后启用注释段） ----------
  docker:
    runs-on: ubuntu-latest
    needs: test
    # ⚠ 禁止在 job 级 if 使用 hashFiles：该函数仅允许在 step 级使用，job 级会让整个 workflow
    #   被 GitHub 判为无效（run 创建后 0 job 瞬时失败）。2026-09-30~10-12 CI 全红即此原因。
    #   Dockerfile 缺失时让 docker build 显式失败（响亮红灯优于静默跳过）。
    steps:
      - uses: actions/checkout@v4

      - name: 构建 Docker 镜像
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      # 如需推送到 Docker Hub / GHCR，配置 secrets 后取消注释
      # - name: 登录 GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: 推送镜像
      #   run: |
      #     docker tag $IMAGE_NAME ghcr.io/${{ github.repository }}/$IMAGE_NAME:latest
      #     docker push ghcr.io/${{ github.repository }}/$IMAGE_NAME:latest

  # ---------- workflow 语法/表达式校验（actionlint；防止非法 workflow 静默失效） ----------
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

# 修改记录：
#   2026-09-29 docker job 增加 hashFiles('Dockerfile') 守卫（⚠ 该写法非法，见 2026-10-12 修复）
#   2026-10-03 test 增加 Linux/Windows 矩阵 + 测试覆盖率；新增 audit（npm audit）与 pack（npm pack smoke）作业
#   2026-10-12 交付质量修复：镜像名 cco；pack smoke 改为 tarball 内容断言 + CLI --version/--help 真实执行 +
#              EOF 退出码断言（移除 `test "$code" != "1"` 弱断言）；新增 compose（docker compose config）作业；
#              docker build 覆盖 PR（不再仅 main push）
#   2026-10-12 根因修复：移除 job 级 if: hashFiles(...)（GitHub 判 workflow 无效 → 0 job 瞬时失败；
#              自 2026-09-30 起 CI 连续全红）；新增 workflow-lint（actionlint）门禁防复发
