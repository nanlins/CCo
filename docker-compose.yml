# 手搓 Claude Code (Anvil) - Docker Compose 编排（基础设施版）
#
# 终端版应用运行在宿主机（npm start / anvil），Docker 只提供基础设施：
#   Redis（缓存+限流） + PostgreSQL(pgvector)（向量/业务存储）
#
# 端口说明（避开本机已有的 WSL Redis:6379 / 本地 PostgreSQL:5432）：
#   redis    :6380  宿主机访问（容器内部 redis:6379）
#   postgres :15434  宿主机访问（容器内部 postgres:5432；15434 避开 Windows 保留端口段）
#
# 用法：
#   docker-compose up -d          # 启动 redis + postgres
#   docker-compose down           # 停止
#
# 终端应用连接（.env）：
#   REDIS_URL=redis://localhost:6380
#   PG_CONNECTION_STRING=postgres://postgres:<你的密码>@localhost:15434/ai_agent

version: '3.8'

services:
  # ---------- Redis（缓存+限流） ----------
  redis:
    image: redis:7-alpine
    container_name: anvil-redis
    ports:
      - '6380:6379' # 宿主机 6380（避免与 WSL Redis 6379 冲突）
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - anvil-net

  # ---------- PostgreSQL + pgvector（向量存储） ----------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: anvil-postgres
    ports:
      - '15434:5432' # 宿主机 15434（避开本地 PostgreSQL 5432 与 Windows 保留端口段 5402-5501）
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD（参考 .env.example）}
      - POSTGRES_DB=ai_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - anvil-net

volumes:
  redis_data:
  postgres_data:

networks:
  anvil-net:
    driver: bridge
# docker-compose：Redis+PostgreSQL 基础设施编排
# 修改记录：
#   2026-10-02 postgres 宿主端口 5434→15434（避开 Windows 保留端口段 5402-5501）
#   2026-10-03 POSTGRES_PASSWORD 改为 \ 环境变量注入（移除硬编码 491220）
